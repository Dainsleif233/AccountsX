## 依赖版本单一数据源（P0.2）。
##
## 只放"与 MC 版本无关"的依赖。与 MC 版本相关的矩阵数据（每个 MC 适配器的
## authlib / Fabric API / 是否混淆）在 `gradle/adapters.toml`。
##
## buildSrc 的两个适配器插件通过 `VersionCatalogsExtension` 读取本文件，
## 根项目通过 `libs.*` 访问器读取。任何依赖版本都不应再以字面量出现在构建脚本里。
## 唯一的例外是 mixin 系列依赖（mixinextras ×2 / sponge-mixin）：它们仅被 buildSrc
## 插件通过动态 `findLibrary` 消费，Gradle 的静态"未使用依赖项别名"检查看不到这层
## 间接，会误报为未使用，故集中放在 `buildSrc/.../accountsx/build/MixinDeps.kt`（见其注释）。

[versions]
gson = "2.14.0"
guava = "33.6.0-jre"
slf4j = "2.0.18"
asm = "9.10.1"
# 编译 core 与所有适配器所用的 Fabric Loader；适配器可在 adapters.toml 里
# 用可选的 `loader` 字段单独覆盖（目前 12 个版本都用这一个）。
fabric-loader = "0.19.4"
# 测试依赖（P0.4）
junit = "5.10.2"
junit-platform = "1.10.2"
assertj = "3.25.3"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
# 测试依赖（P0.4）
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
