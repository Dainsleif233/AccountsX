## 版本矩阵单一数据源（P0.2）。
##
## 消费者：
##   - `settings.gradle.kts`      —— 决定包含哪些子项目（不再列目录）
##   - `buildSrc` 的两个适配器插件 —— 每个适配器的依赖版本与 fabric.mod.json 占位符
##   - 根 `build.gradle.kts`      —— universal 打包时每个适配器的产物任务名
##   - `:validateAdapterMatrix`（P0.5）—— 校验本文件与磁盘目录一致 + 模拟 Loader 选择
##
## 约定：
##   - `version` 必须等于 `adapters/<type>/<version>/` 目录名；
##   - `obfuscated = false` 表示该 MC 版本没有 ProGuard 混淆（26.1+），
##     构建用 `fabric-loom` + `jar`，而不是 `fabric-loom-remap` + `remapJar`，
##     且 `officialMojangMappings()` 不可用；
##   - `loader` 可选，缺省取 `gradle/libs.versions.toml` 的 `fabric-loader`。
##
## 解析器只支持这里用到的 TOML 子集（`[[表]]` + 引号字符串 / 布尔值），
## 见 `buildSrc/src/main/kotlin/accountsx/build/Toml.kt`。

