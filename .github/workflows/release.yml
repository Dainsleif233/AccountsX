name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false
      draft:
        description: "Create as draft"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Failed to read version from gradle.properties"
            exit 1
          fi
          TAG="$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag: $TAG)"

      - name: Check If Tag Exists
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' already exists, please update the version in gradle.properties first"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists on the remote repository, please update the version in gradle.properties first"
            exit 1
          fi

      - name: Build All Adapters and Universal JAR
        shell: bash
        env:
          # Multi-adapter Loom builds require a larger heap
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Override the Chinese mirrors (gradle.properties) with the official
          # endpoints, since GitHub-hosted runners cannot reach BMCLAPI/USTC.
          ./gradlew --no-daemon --stacktrace \
            -Ploom_libraries_base=https://libraries.minecraft.net/ \
            -Ploom_resources_base=https://resources.download.minecraft.net/ \
            -Ploom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest.json \
            -Ploom_fabric_repository=https://maven.fabricmc.net/ \
            build

      - name: Find Build Artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          UNIVERSAL="build/libs/AccountsX-${VERSION}.jar"
          if [[ ! -f "$UNIVERSAL" ]]; then
            echo "::error::Expected build artifact not found: $UNIVERSAL"
            echo "Available jar files:"
            find build/libs -type f -name '*.jar' -print || true
            exit 1
          fi
          echo "universal=$UNIVERSAL" >> "$GITHUB_OUTPUT"
          ls -lh "$UNIVERSAL"

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          {
            echo "## 更新内容"
            echo

            if [[ -n "$PREV_TAG" ]]; then
              echo "自 \`$PREV_TAG\` 以来的变更："
              echo
              RANGE="${PREV_TAG}..HEAD"
            else
              echo "初始版本发布说明："
              echo
              RANGE="HEAD"
            fi

            mapfile -t COMMITS < <(git log $RANGE --pretty=format:'%s|%h' --no-merges)

            if [[ ${#COMMITS[@]} -eq 0 || -z "${COMMITS[0]:-}" ]]; then
              echo "_此版本无提交记录。_"
            else
              declare -A SECTIONS
              SECTIONS[feat]="### 新功能"
              SECTIONS[fix]="### Bug 修复"
              SECTIONS[refactor]="### 重构"
              SECTIONS[perf]="### 性能优化"
              SECTIONS[docs]="### 文档"
              SECTIONS[chore]="### 杂项"
              SECTIONS[other]="### 其他变更"

              declare -A BUCKETS
              for key in feat fix refactor perf docs chore other; do
                BUCKETS[$key]=""
              done

              COMMIT_PATTERN='^(feat|fix|refactor|perf|docs|chore|ver|update)(\([^)]+\))?(!)?:[[:space:]]*(.+)$'

              for line in "${COMMITS[@]}"; do
                subject="${line%%|*}"
                hash="${line##*|}"
                if [[ "$subject" =~ $COMMIT_PATTERN ]]; then
                  type="${BASH_REMATCH[1]}"
                  body="${BASH_REMATCH[4]}"
                  case "$type" in
                    ver|update) type="chore" ;;
                  esac
                  BUCKETS[$type]+="- ${body}（[\`${hash}\`](https://github.com/${{ github.repository }}/commit/${hash})）"$'\n'
                else
                  BUCKETS[other]+="- ${subject}（[\`${hash}\`](https://github.com/${{ github.repository }}/commit/${hash})）"$'\n'
                fi
              done

              for key in feat fix refactor perf docs chore other; do
                if [[ -n "${BUCKETS[$key]}" ]]; then
                  echo "${SECTIONS[$key]}"
                  echo
                  printf '%s' "${BUCKETS[$key]}"
                  echo
                fi
              done
            fi

            echo
            echo "**完整变更日志**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD)}...${TAG}"
          } > release_notes.md

          echo "----- Changelog -----"
          cat release_notes.md

      - name: Create Tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ steps.artifacts.outputs.universal }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
