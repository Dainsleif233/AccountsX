name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      # Compute the CI build version: base version from gradle.properties with a
      # `+build.<run_number>` SemVer build-metadata suffix, so every artifact is
      # uniquely identifiable per CI run (e.g. AccountsX-2.0.0-beta.1+build.16.jar).
      # It also flows into the nested adapter jars, because each adapter plugin
      # sets `version = rootProject.version`.
      - name: Compute build version
        id: build-version
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(grep -E '^version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
          if [[ -z "$BASE" ]]; then
            echo "::error::Failed to read version from gradle.properties"
            exit 1
          fi
          echo "version=${BASE}+build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Resolved CI build version: ${BASE}+build.${{ github.run_number }}"
      # One Gradle invocation on purpose: a per-adapter job matrix measured
      # ~7m40s wall clock versus ~3m for the full build, because each job pays
      # checkout + JDK + cache restore + buildSrc compile + configuration of
      # all 17 subprojects again (Loom configures every project even when only
      # one is built). `build` depends on `universal`, so this also produces
      # the nested fat jar; `verifyUniversalJar` then checks its structure.
      - name: Build
        run: ./gradlew --no-daemon --stacktrace -Pversion="${{ steps.build-version.outputs.version }}" build verifyUniversalJar
      # Upload exactly the universal fat jar. `archive: false` requires a single
      # file, and `build/libs/AccountsX-*.jar` also matched the core jar
      # (`AccountsX-core-*.jar`, produced by `:jar` with `archiveAppendix = "core"`),
      # which made upload-artifact fail with "only a single file can be uploaded".
      # Pin to the exact version computed above so only the universal jar matches.
      - uses: actions/upload-artifact@v7
        with:
          name: AccountsX-universal
          path: build/libs/AccountsX-${{ steps.build-version.outputs.version }}.jar
          archive: false

  # Client game tests launch a real Minecraft client per adapter (Fabric
  # client-gametest). Only the 7 adapters with a client-gametest API can run
  # these; on PRs we exercise three representatives spanning both mapping paths
  # (1.21.4 obfuscated, 26.1 first non-obfuscated, 26.3 latest). The full
  # 7-version sweep runs nightly (gametest-nightly.yml). Loom wraps the client
  # in xvfb automatically when CI=true on Linux; assertions are widget-level,
  # not pixel-level, so software rendering (llvmpipe) does not flake them.
  gametest:
    name: Game tests (${{ matrix.mc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.4', '26.1', '26.3']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - name: Install headless rendering
        # GLFW needs a 24-bit GLX visual from mesa's llvmpipe; SDL (26.3) needs EGL
        # because Xvfb's GLX offers no sRGB framebuffer. Recipes borrowed from upstream
        # Fabric (xvfb) and LiquidBounce (libegl + SDL_VIDEO_FORCE_EGL).
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libegl-mesa0
      - name: Run client game tests
        env:
          SDL_VIDEO_FORCE_EGL: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        # 24-bit screen gives GLFW a usable GLX visual; Loom's own xvfb wrapping is
        # disabled in buildSrc so it cannot nest a default-depth server inside this one.
        run: >-
          xvfb-run -a -s "-screen 0 1280x720x24"
          ./gradlew --no-daemon --stacktrace
          :adapters:mc:${{ matrix.mc }}:runClientGameTest
          :adapters:mc:${{ matrix.mc }}:runClientAuthlibInjectorGameTest
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-${{ matrix.mc }}
          path: |
            adapters/mc/${{ matrix.mc }}/build/run/clientGameTest/screenshots
            adapters/mc/${{ matrix.mc }}/build/run/clientGameTest/logs/latest.log
            adapters/mc/${{ matrix.mc }}/build/run/clientAuthlibInjectorGameTest/screenshots
            adapters/mc/${{ matrix.mc }}/build/run/clientAuthlibInjectorGameTest/logs/latest.log
          if-no-files-found: ignore

