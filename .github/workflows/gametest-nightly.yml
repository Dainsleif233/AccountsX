name: Game tests (full sweep)

# Nightly sweep across all 7 adapters that have a client-gametest API. PRs only
# run three representatives (see ci.yml); this catches regressions in the four
# versions not exercised on every PR. Also runnable on demand.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: gametest-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gametest:
    name: Game tests (${{ matrix.mc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.4', '1.21.6', '1.21.9', '1.21.11', '26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - name: Install headless rendering
        # GLFW needs a 24-bit GLX visual from mesa's llvmpipe; SDL (26.3) needs EGL
        # because Xvfb's GLX offers no sRGB framebuffer. Recipes borrowed from upstream
        # Fabric (xvfb) and LiquidBounce (libegl + SDL_VIDEO_FORCE_EGL).
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libegl-mesa0
      - name: Run client game tests
        env:
          SDL_VIDEO_FORCE_EGL: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        # 24-bit screen gives GLFW a usable GLX visual; Loom's own xvfb wrapping is
        # disabled in buildSrc so it cannot nest a default-depth server inside this one.
        run: >-
          xvfb-run -a -s "-screen 0 1280x720x24"
          ./gradlew --no-daemon --stacktrace
          :adapters:mc:${{ matrix.mc }}:runClientGameTest
          :adapters:mc:${{ matrix.mc }}:runClientAuthlibInjectorGameTest
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-${{ matrix.mc }}
          path: |
            adapters/mc/${{ matrix.mc }}/build/run/clientGameTest/screenshots
            adapters/mc/${{ matrix.mc }}/build/run/clientGameTest/logs/latest.log
            adapters/mc/${{ matrix.mc }}/build/run/clientAuthlibInjectorGameTest/screenshots
            adapters/mc/${{ matrix.mc }}/build/run/clientAuthlibInjectorGameTest/logs/latest.log
          if-no-files-found: ignore
