name: Setup build environment
description: JDK + Gradle + caches + official upstream mirrors

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "25"

    - name: Use official mirrors and set JVM args
      shell: bash
      run: |
        set -euo pipefail
        chmod +x gradlew
        wrapper=gradle/wrapper/gradle-wrapper.properties
        url="$(sed -n 's/^distributionUrl=//p' "$wrapper" | tr -d '\r')"
        mirror='https\://mirrors.cloud.tencent.com/gradle/'
        archive="${url#"$mirror"}"
        if [[ ! "$archive" =~ ^gradle-[0-9]+[.][0-9]+([.][0-9]+)?-bin[.]zip$ ]]; then
          echo '::error::The tracked Gradle Wrapper URL must use the Tencent mirror. Run: bash gradle/wrapper-mirror.sh gradle/wrapper/gradle-wrapper.properties'
          exit 1
        fi
        # 只改 runner 的工作树，仓库里仍是镜像地址。
        sed -i '/^distributionUrl=/s|mirrors[.]cloud[.]tencent[.]com/gradle/|services.gradle.org/distributions/|' "$wrapper"
        # 校验和只在这里补：仓库里不能有 distributionSha256Sum，理由见 AGENTS.md「命令与代价」的 Wrapper 条目。
        sum="$(curl -fsSL --retry 3 --max-time 30 "https://services.gradle.org/distributions/${archive}.sha256" | tr -d '\r[:space:]')"
        if [[ ! "$sum" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::Could not read the official SHA-256 for ${archive}."
          exit 1
        fi
        sed -i "/^distributionSha256Sum=/d" "$wrapper"
        printf 'distributionSha256Sum=%s\n' "$sum" >> "$wrapper"
        # 追加到文件末尾：键重复时 Gradle 取最后一次出现的值，以此覆盖仓库里的国内镜像默认值。
        {
          echo "loom_libraries_base=https://libraries.minecraft.net/"
          echo "loom_resources_base=https://resources.download.minecraft.net/"
          echo "loom_version_manifests=https://piston-meta.mojang.com/mc/game/version_manifest.json"
          echo "loom_fabric_repository=https://maven.fabricmc.net/"
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        } >> gradle.properties

    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
        cache-cleanup: on-success

    - name: Cache Loom project cache
      uses: actions/cache@v6
      with:
        # Only the project-local cache needs its own layer. The other large
        # Loom data (mappings / merged MC jars) lives under ~/.gradle/caches/
        # and is already covered by setup-gradle's gradle-home cache, so
        # caching it here too would restore and save it twice per run.
        path: |
          .gradle/loom-cache
        key: loom-${{ runner.os }}-${{ hashFiles('gradle/adapters.toml', 'gradle.properties') }}
        restore-keys: loom-${{ runner.os }}-

